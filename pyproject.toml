[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xai-clinic"
version = "1.0.0"
description = "Explainable, audited heart-disease detection with SHAP on four-hospital UCI data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "joblib>=1.3",
    "streamlit>=1.35",
]

[project.scripts]
xai-clinic = "xai_clinic.run_models:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=6.29",
]

[tool.hatch.build.targets.wheel]
packages = ["xai_clinic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
